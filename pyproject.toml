[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dorkint"
version = "0.1.0"
description = "Google dork generator for OSINT reconnaissance (no search is run)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
dorkint = "dorkint.cli:main"
dorkint-tool = "dorkint.tui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dorkint"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
